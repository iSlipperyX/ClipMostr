# Builds ClipMonster on Windows and publishes a GitHub Release whenever a version tag
# (v1.2.3, or v1.3.0-beta.1 for a pre-release) is pushed. Installed copies of the app
# find these releases through the GitHub API and update themselves.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai,whisper,build]"

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(python -c "import ytclip; print(ytclip.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ytclip.__version__ ($version). Run: python release.py <version>"
            exit 1
          fi

      # Whisper for the graphics card. If this fails the app still ships, with Whisper on the CPU only.
      - name: Cache the whisper.cpp build
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: build/whisper-cpp
          key: whisper-cpp-vulkan-${{ hashFiles('packaging/build_whisper_cpp.py', 'packaging/install_vulkan_sdk.ps1') }}

      - name: Vulkan SDK
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: ./packaging/install_vulkan_sdk.ps1

      - name: Build whisper.cpp for the graphics card
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python packaging/build_whisper_cpp.py build/whisper-cpp --vulkan

      - name: Build
        run: python build.py

      - name: Checksum
        shell: bash
        working-directory: dist
        run: sha256sum ClipMonster-windows.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          # Hand-written notes in release-notes/<tag>.md go first; GitHub's change list follows them.
          notes=()
          if [ -f "release-notes/$GITHUB_REF_NAME.md" ]; then notes=(--notes-file "release-notes/$GITHUB_REF_NAME.md"); fi
          gh release create "$GITHUB_REF_NAME" dist/ClipMonster-windows.zip dist/SHA256SUMS.txt \
            --title "ClipMonster ${GITHUB_REF_NAME#v}" "${notes[@]}" --generate-notes $prerelease
