# Builds ClipMonster on Windows and publishes a GitHub Release whenever a version tag
# (v1.2.3, or v1.3.0-beta.1 for a pre-release) is pushed. Installed copies of the app
# find these releases through the GitHub API and update themselves.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai,whisper,build]"

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(python -c "import ytclip; print(ytclip.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ytclip.__version__ ($version). Run: python release.py <version>"
            exit 1
          fi

      - name: Build
        run: python build.py

      - name: Checksum
        shell: bash
        working-directory: dist
        run: sha256sum ClipMonster-windows.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/ClipMonster-windows.zip dist/SHA256SUMS.txt \
            --title "ClipMonster ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
