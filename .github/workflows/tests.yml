# Runs the test suite on every pull request, every push to main and every push to a work branch.
# Linux runs on Python 3.12; Windows runs on 3.14, the version the release build and Justyn's PC use,
# so Windows-only behaviour (paths, file locks, the updater's install step, the Start with Windows entry) is tested before a release.
# GUI tests use Qt's offscreen platform.
name: Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest -q

  # Whisper through whisper.cpp, for real: a CPU build typing out its own sample, through ClipMonster's
  # wrapper (whisper_cpp.py), plus a check that every model it may download exists.
  whisper-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test]"
      - name: Build whisper.cpp (CPU)
        run: |
          tag=$(python -c "import runpy; print(runpy.run_path('packaging/build_whisper_cpp.py')['TAG'])")
          git clone --depth 1 --branch "$tag" https://github.com/ggml-org/whisper.cpp whisper-src
          python packaging/build_whisper_cpp.py build/whisper-cpp --source whisper-src
      - name: Test
        env:
          CLIPMONSTER_WHISPER_CPP: build/whisper-cpp/whisper-cli
          CLIPMONSTER_WHISPER_SAMPLE: whisper-src/samples/jfk.wav
          CLIPMONSTER_CHECK_MODEL_URLS: "1"
        run: pytest -q tests/test_whisper_cpp_real.py

  # The release workflow's Vulkan build of whisper.cpp, so a broken one shows up before a release.
  whisper-cpp-vulkan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Vulkan SDK
        shell: pwsh
        run: ./packaging/install_vulkan_sdk.ps1
      - name: Build whisper.cpp for the graphics card
        run: python packaging/build_whisper_cpp.py build/whisper-cpp --vulkan
      - name: Check the build
        shell: bash
        run: |
          ls -la build/whisper-cpp
          test -s build/whisper-cpp/whisper-cli.exe
          cat build/whisper-cpp/VERSION.txt

  # The updater's install step as installed copies run it: a real PyInstaller build's own ytclip.exe
  # installing itself over another copy of the build. Then ClipMonster-Setup.exe, for real: install,
  # install again over itself, uninstall.
  frozen-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[ai,whisper,build]"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        run: python build.py --installer
      - name: Update the build with its own helper
        run: python tests/windows/frozen_update.py dist/ClipMonster
      - name: Install, update and uninstall with ClipMonster-Setup.exe
        run: python tests/windows/setup_exe.py dist/ClipMonster-Setup.exe
