[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytclip"
dynamic = ["version"]
description = "ClipMonster: finds YouTube videos, cuts them into clips and posts them to TikTok by itself."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "imageio-ffmpeg>=0.5,<0.8",  # 0.8 (ffmpeg 9) draws caption text 1-2 px off the editor's preview: tests/test_export_view.py
    "numpy>=1.24",
    "rich>=13",
    "PySide6-Essentials>=6.7",
    "PySide6-Addons>=6.7",
    "playwright>=1.48",  # posting to TikTok, in your installed Edge or Chrome
    "anthropic>=1.0",
    "opencv-python-headless>=4.9,<5",  # face tracking for the pro edit (OpenCV 5 dropped the Haar fallback)
    "cryptography>=42",  # the Mac app's server makes its own HTTPS certificate (remote/certs.py)
]

[project.optional-dependencies]
ai = []  # the AI is always included now; kept so `pip install -e .[ai,…]` still works
whisper = ["faster-whisper>=1.0"]
# The local AI runs llama.cpp's llama-server (bundled with the app; packaging/build_llama_cpp.py). From
# source without that build, the Python binding works too:
local = ["llama-cpp-python>=0.3"]
# The Video Creator (ytclip create, the Creator tab). Kokoro-82M is its main voice; it falls back to Piper,
# then Windows' own voices or eSpeak NG, so none of these is required.
creator = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
piper = ["piper-tts>=1.2"]
# AI pictures from Python (SDXL-Turbo / FLUX.1-schnell). Several GB; install the torch build for your graphics
# card first (pytorch.org). Without it, ComfyUI (if you run it), your B-roll folder or built-in textures are used.
diffusion = ["torch>=2.3", "diffusers>=0.30", "transformers>=4.44", "accelerate>=0.33", "safetensors>=0.4"]
# The Sports event search's sentence model (all-MiniLM-L6-v2, 90 MB, downloaded on first use) runs on ONNX
# Runtime. Install ONE of these: the three builds share the module name `onnxruntime`, and two at once break
# each other. Without any, the search matches by words. Which processor it uses is picked at run time
# (intelligence/hardware.py: onnx_providers), falling back to the CPU when a provider can't load the model.
#   search           the standard build: the CPU on Windows and Linux; on a Mac it includes Core ML
#                    (Apple silicon's Neural Engine and graphics). The Windows app ships this one (with Kokoro).
#   search-directml  Windows, any DirectX 12 graphics card: AMD Radeon, Intel Arc, NVIDIA
#   search-cuda      NVIDIA with CUDA 12 and cuDNN 9 installed (Windows or Linux)
# The local AI's own acceleration is llama.cpp's, not ONNX: Metal on a Mac, CUDA or Vulkan on Windows and Linux
# (packaging/build_llama_cpp.py builds the server the app ships).
search = ["onnxruntime>=1.17"]
search-directml = ["onnxruntime-directml>=1.17; sys_platform == 'win32'"]
search-cuda = ["onnxruntime-gpu>=1.19; sys_platform != 'darwin'"]
build = ["pyinstaller>=6.10"]
# ClipMonster for Mac (ytclip/mac/; packaging/build_mac.py): pip install -e ".[mac]" on a Mac. Its API keys and
# its key for each PC go in the Keychain, and Deno (for YouTube) comes with it; whisper.cpp stands in for
# faster-whisper, and Playwright (posting, on the PC) isn't used.
mac = ["keyring>=24", "deno>=2.4"]
test = ["pytest>=8.2"]

[project.scripts]
ytclip = "ytclip.cli:main"

[project.gui-scripts]
clipmonster = "ytclip.gui.app:main"
clipmonster-mac = "ytclip.mac.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["ytclip", "ytclip.gui", "ytclip.posting", "ytclip.posting.tiktok", "ytclip.intelligence",
            "ytclip.vision", "ytclip.audio", "ytclip.rendering", "ytclip.compliance",
            "ytclip.creator", "ytclip.telegram", "ytclip.remote", "ytclip.mac", "ytclip.sportsdesk",
            "ytclip.research"]
package-data = { ytclip = ["fonts/*.ttf", "fonts/licenses/*.txt"] }

[tool.setuptools.dynamic]
version = { attr = "ytclip.__version__" }  # single source of truth; release.py bumps it
